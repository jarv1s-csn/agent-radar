name: radar

on:
  schedule:
    # Mondays 01:17 UTC (09:17 Beijing / Sunday evening US Pacific)
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s tests

      # Exits non-zero and writes nothing if any part of the scan fails,
      # so the commit step below is skipped and the run shows as failed.
      - name: Run radar
        run: python radar.py --config radar.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit snapshot and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "radar: $(date -u +%F)"
            git push
          fi
